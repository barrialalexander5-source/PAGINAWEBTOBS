<!--
  Componente de referencia: Header + status bar.
  Ya está incluido directamente en cada página de /pages y en index.html.
  Nota: abrir archivos HTML con doble clic (file://) bloquea fetch() por CORS,
  por eso este proyecto embebe el header en cada página en vez de inyectarlo.
  Si sirves el sitio con un servidor local (Live Server, `npx serve`, etc.)
  puedes usar fetch() + innerHTML para inyectar este fragmento dinámicamente.
-->

  <div class="container">

    <div class="status-item">SLA promedio: <strong>99.98%</strong></div>
    <div class="status-item">Mesa de soporte: <strong>24 / 7</strong></div>
    <div class="status-item" data-clock="lima">-- : -- : --</div>
  </div>
</div>
